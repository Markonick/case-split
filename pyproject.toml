[project]
name = "case-split"
version = "0.1.0"
description = "Pure-logic slice: split the overloaded Case into Customer + Property + Lead. Offline, no DB, no Clerk."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
# `domain/` is a top-level package in this repo; put the root on the path so
# `from domain... import ...` resolves without an install step.
pythonpath = ["."]
